name: Build Oxide standalone LiveContainer library
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-oxide.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      UPSTREAM_COMMIT: 52ee6b5a1eb8a102655a2eb5c7e59f78e173c96e
      THEOS_COMMIT: 304e0799973e8145f32e4ca2de6c747a84b758ce
    steps:
      - name: Download pinned source and Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/MinistrDresdena/oxide-skeet.git source
          git -C source checkout "$UPSTREAM_COMMIT"
          git clone https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git -C "$RUNNER_TEMP/theos" checkout "$THEOS_COMMIT"
          git -C "$RUNNER_TEMP/theos" submodule update --init --recursive
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          brew install ldid xz dpkg
      - name: Apply reviewed stability changes
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for filename in ['DrawHelpers.mm', 'ESPConfig.h', 'Esp/ImGuiLoad.m', 'Esp/PubgLoad.mm', 'IL2CPP/Hooks.h', 'IL2CPP/Il2cppR.cpp', 'IMGUI/Il2cpp.cpp', 'IMGUI/Il2cpp.h', 'ImGuiDrawView.mm', 'Init/IL2CPPInit.mm', 'Makefile.make', 'control']:
              file = Path(filename)
              file.write_bytes(file.read_bytes().replace(b'\r\n', b'\n'))
          Path('../stability.patch').write_bytes(base64.b64decode(''))
          PY
          git apply --check ../stability.patch
          git apply ../stability.patch
          cp Makefile.make Makefile
      - name: Build standalone arm64 library
        shell: bash
        run: |
          set -euo pipefail
          cd source
          make clean
          make -j2 all FINALPACKAGE=1
          mkdir -p ../result
          binary=.theos/obj/OxideLiveContainer.dylib
          test -f "$binary"
          cp "$binary" ../result/
          lipo -info "$binary"
          otool -L "$binary"
          xcrun vtool -show-build "$binary"
          codesign --force --sign - ../result/OxideLiveContainer.dylib
          codesign --verify --strict ../result/OxideLiveContainer.dylib
          shasum -a 256 ../result/*.dylib > ../result/SHA256.txt
          cp ../stability.patch ../result/source.patch
          printf '%s\n' 'Standalone build; static checks only. No on-device functionality claim.' > ../result/STATUS.txt
      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: oxide-livecontainer-library
          path: result/
          if-no-files-found: error
          retention-days: 7
